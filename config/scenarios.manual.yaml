ExPol:
# UBA CO2 pathway instead of KSG targets
# Europen CO2 pathway fixed at 2030 for 2035-2050
# Kernnetz is not assumed to be built
# Not forcing renewables after 2030

  pypsa-de:
    reference_scenario: ExPol

  co2_budget_DE_source: UBA

  co2_budget:
    2030: 0.513
    2035: 0.429
    2040: 0.362
    2045: 0.311
    2050: 0.283

  costs:
    transmission: "underground" # either overhead line ("overhead") or underground cable ("underground")
  solving:
    constraints:
      limits_capacity_min:
        Generator:
          onwind:
            DE:
              2030: 86.5   # 75 % Wind-an-Land Law
          offwind:
            DE:
              2030: 17.3
              2035: 29.3
          solar:
            DE:
              2030: 161.25   # 75 % PV strategy
      # boundary condition of maximum volumes
      limits_capacity_max:
        Generator:
          offwind:
            DE:
              2020: 7.8
              2025: 11.3
              2030: 17.3 # 12 less than NEP, because of 1 year delay
              2035: 40 # 29.3 + half of extra projects
          onwind:
            DE:
              2030: 94.5 # uba Projektionsbericht
          solar:
            DE:
              2030: 215 # uba Projektionsbericht


  sector:
    district_heating:
      potential: 0.1

  offshore_nep_force:
    cutin_year: 2025
    cutout_year: 2035 # Hackily reduced to 2030 if delay_years: 1
    delay_years: 1


KN2045_Mix:
# Default scenario, defined in pypsa.de.yaml
# Ausgewogener Mix an Technologien zur Dekarbonisierung der Sektoren
# Breites Energieträgerportfolio in der Endenergie (Strom, Wasserstoff, synthetische Kraftstoffe)
# Ausbau der erneuerbare Stromerzeugung erreicht politisch gesetzte Ziele
# Importe erneuerbar erzeugter Energien auf mittlerem Niveau
# dient als Referenzszenario in der Familie der Ariadne-Szenarien


KN2045_Mix_FixedRenewables_BEVDSMOff:
  sector:
    bev_dsm: false
  solving:
    constraints:
      # Fixed German renewable capacities from law/reference targets.
      # Set min and max equal so these capacities are built exactly.
      limits_capacity_min:
        Generator:
          onwind:
            DE:
              2025: 68.1 # existing installed capacity reference
              2030: 115 # Wind-an-Land Law
              2035: 157 # Wind-an-Land Law
              2040: 160 # Wind-an-Land Law
              2045: 160
          offwind:
            DE:
              2025: 9.5 # existing installed capacity reference
              2030: 30 # Wind-auf-See Law
              2035: 40 # Wind-auf-See Law
              # assuming at least 1/3 of difference reached in 2040
              2040: 50
              2045: 70 # Wind-auf-See Law
          solar:
            DE:
              2025: 117 # existing installed capacity reference
              2030: 215 # PV strategy
              2035: 309
              2040: 400 # PV strategy
              2045: 400
        Store:
          home battery:
            DE:
              2025: 0 # no system-available residential battery flexibility
              2030: 5.43 # ERAA residential storage, 2.688 GW at ~2h
              2035: 24.29 # ERAA residential storage, 11.477 GW at ~2.1h
        Link:
          home battery discharger:
            DE:
              2025: 0 # no system-available residential battery flexibility
              2030: 2.688 # ERAA residential storage
              2035: 11.477 # ERAA residential storage
      limits_capacity_max:
        Generator:
          onwind:
            DE:
              2025: 68.1 # existing installed capacity reference
              2030: 115 # Wind-an-Land Law
              2035: 157 # Wind-an-Land Law
